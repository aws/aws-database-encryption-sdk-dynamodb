# This workflow reads the project.properties
# into the environment variables
# and then creates an output variable for `dafnyVersion`
name: Dafny Version

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to checkout"
        required: false
        type: string
    outputs:
      version:
        description: "The dafny version"
        value: ${{ jobs.getDafnyVersion.outputs.version }}

jobs:
  getDafnyVersion:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    runs-on: codebuild-CryptoToolsCI-linux-aws-database-encryption-sdk-dynamodb-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      version: ${{ steps.read_property.outputs.dafnyVersion }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.head_ref || github.ref }}
      - name: Read version from Properties-file
        id: read_property
        shell: bash
        run: echo "dafnyVersion=$(grep '^dafnyVersion=' ./project.properties | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
