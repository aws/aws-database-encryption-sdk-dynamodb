# This workflow runs for every pull request
name: Non Prod Daily CI

permissions:
  id-token: write
  contents: read
on:
  schedule:
    - cron: "00 18 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/non-prod.yml"
      - ".github/workflows/ci_test_go.yml"

jobs:
  getVersion:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/dafny_version.yml
  pr-ci-go:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    needs: getVersion
    uses: ./.github/workflows/ci_test_go.yml
    with:
      dafny: ${{needs.getVersion.outputs.version}}
      platforms: '[{"os": "ubuntu-22.04", "runner": "codebuild-CryptoToolsCI-linux-aws-database-encryption-sdk-dynamodb-${{ github.run_id }}-${{ github.run_attempt }}"}]'
  pr-ci-go-macos:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    needs: getVersion
    uses: ./.github/workflows/ci_test_go.yml
    with:
      dafny: ${{needs.getVersion.outputs.version}}
      platforms: '[{"os": "macos-15-intel", "runner": "macos-15-intel", "docker-action": "docker/setup-docker-action@v5"}]'
