# This workflow verifies
# that the source is annotated
# with respect to the specification
name: Duvet report

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  duvet:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    runs-on: codebuild-CryptoToolsCI-linux-aws-database-encryption-sdk-dynamodb-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install duvet
        shell: bash
        run: |
          cargo +stable install duvet
      - name: Run the duvet report
        shell: bash
        run: |
          make duvet
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: specification_compliance_report
          path: specification_compliance_report.html
