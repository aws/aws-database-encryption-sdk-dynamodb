# This workflow performs tests in Java.
name: Library Java tests

on:
  workflow_call:
    inputs:
      dafny:
        description: "The Dafny version to run"
        required: true
        type: string
      branch:
        description: "Branch to checkout"
        required: false
        type: string
      regenerate-code:
        description: "Regenerate code using smithy-dafny"
        required: false
        default: false
        type: boolean
      mpl-version:
        description: "MPL version to use"
        required: false
        type: string
      mpl-head:
        description: "Running on MPL HEAD"
        required: false
        default: false
        type: boolean

jobs:
  testJava:
    strategy:
      fail-fast: false
      matrix:
        library: [DynamoDbEncryption]
        java-version: [8, 11, 17, 19, 21]
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-DDBEC-Dafny-Role-us-west-2
          role-session-name: DDBEC-Dafny-Java-Tests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      # Rust files have long names, so we need to enable long paths
      - name: Enable long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.head_ref || github.ref }}
          submodules: recursive

      - name: Setup Dafny
        uses: ./submodules/MaterialProviders/.github/actions/setup_dafny/
        with:
          dafny-version: ${{ inputs.dafny }}

      - name: Update MPL submodule if using MPL HEAD
        if: ${{ inputs.mpl-head == true }}
        working-directory: submodules/MaterialProviders
        run: |
          git checkout main
          git pull
          git submodule update --init --recursive
          git rev-parse HEAD

      - name: Update project.properties if using MPL HEAD
        if: ${{ inputs.mpl-head == true }}
        run: |
          sed "s/mplDependencyJavaVersion=.*/mplDependencyJavaVersion=${{inputs.mpl-version}}/g" project.properties > project.properties2; mv project.properties2 project.properties

      - name: Install Smithy-Dafny codegen dependencies
        uses: ./submodules/MaterialProviders/.github/actions/install_smithy_dafny_codegen_dependencies
        with:
          mpl-submodule-path: ./submodules/MaterialProviders/

      - name: Regenerate code using smithy-dafny if necessary
        if: ${{ inputs.regenerate-code }}
        uses: ./.github/actions/polymorph_codegen
        with:
          dafny: ${{ env.DAFNY_VERSION }}
          library: ${{ matrix.library }}
          diff-generated-code: false
          update-and-regenerate-mpl: true

      - name: Setup Java 8
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 8

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: ${{ matrix.java-version }}

      # The test server dashboard merges the tests' line coverage, line by
      # line, with the coverage the Java test server gives the same commit.
      # The build's own jacoco plugin already records the Test task in
      # build/jacoco/test.exec, and a second agent in that JVM aborts it, so
      # the init script adds the agent only to JavaExec tasks (runTests).
      - name: Turn on line coverage
        if: runner.os == 'Linux' && matrix.java-version == 17 && (github.event_name == 'pull_request' || github.event_name == 'push')
        shell: bash
        env:
          JACOCO_VERSION: 0.8.13
        run: |
          dir="$RUNNER_TEMP/jacoco"
          mkdir -p "$dir" "$RUNNER_TEMP/local-coverage" ~/.gradle/init.d
          base=https://repo1.maven.org/maven2/org/jacoco
          curl -sSfL -o "$dir/jacocoagent.jar" "$base/org.jacoco.agent/$JACOCO_VERSION/org.jacoco.agent-$JACOCO_VERSION-runtime.jar"
          curl -sSfL -o "$dir/jacococli.jar" "$base/org.jacoco.cli/$JACOCO_VERSION/org.jacoco.cli-$JACOCO_VERSION-nodeps.jar"
          printf '%s  %s\n' \
            47e700ccb0fdb9e27c5241353f8161938f4e53c3561dd35e063c5fe88dc3349b jacocoagent.jar \
            8f748683833d4dc4d72cea5d6b43f49344687b831e0582c97bcb9b984e3de0a3 jacococli.jar \
            | (cd "$dir" && sha256sum -c -)
          agent="-javaagent:$dir/jacocoagent.jar=destfile=$dir/jacoco.exec,append=true"
          cat > ~/.gradle/init.d/local-coverage.gradle <<EOF
          allprojects {
              tasks.withType(JavaExec).configureEach { jvmArgs '$agent' }
          }
          EOF
          echo "LOCAL_COVERAGE=dbesdk" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.library }} implementation
        shell: bash
        working-directory: ./${{ matrix.library }}
        run: |
          # This works because `node` is installed by default on GHA runners
          CORES=$(node -e 'console.log(os.cpus().length)')
          make build_java CORES=$CORES

      - name: Test ${{ matrix.library }}
        working-directory: ./${{ matrix.library }}
        run: |
          make test_java

      # Paths are made relative to the repository so the two reports line up.
      - name: Write the line coverage report
        if: env.LOCAL_COVERAGE != ''
        shell: bash
        run: |
          data=()
          for exec in "$RUNNER_TEMP/jacoco/jacoco.exec" ${{ matrix.library }}/runtimes/java/build/jacoco/test.exec; do
            if [ -f "$exec" ]; then data+=("$exec"); fi
          done
          if [ ${#data[@]} -eq 0 ]; then
            echo "::warning::no JaCoCo data"
            exit 0
          fi
          java -jar "$RUNNER_TEMP/jacoco/jacococli.jar" report "${data[@]}" \
            --classfiles ${{ matrix.library }}/runtimes/java/build/classes/java/main \
            --xml "$RUNNER_TEMP/local-coverage/jacoco.xml"
          args=()
          for root in ${{ matrix.library }}/runtimes/java/src/main/*/; do
            args+=(--source-root "$root")
          done
          python3 .github/scripts/coverage_lcov.py jacoco \
            "$RUNNER_TEMP/local-coverage/jacoco.xml" "$RUNNER_TEMP/local-coverage/dbesdk-java.lcov" "${args[@]}"

      - name: Upload the line coverage report
        if: env.LOCAL_COVERAGE != ''
        uses: actions/upload-artifact@v7
        with:
          name: local-coverage-dbesdk-java
          path: ${{ runner.temp }}/local-coverage/dbesdk-java.lcov
          if-no-files-found: warn
