# This workflow performs static analysis checks.
name: Library format check

on:
  workflow_call:
    inputs:
      dafny:
        description: "The Dafny version to run"
        required: true
        type: string
      branch:
        description: "Branch to checkout"
        required: false
        type: string
      regenerate-code:
        description: "Regenerate code using smithy-dafny"
        required: false
        default: false
        type: boolean
jobs:
  format_projects:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # Don't run the nightly build on forks
    if: github.event_name != 'schedule' || github.repository_owner == 'aws'
    strategy:
      matrix:
        os: [ubuntu-22.04]
    runs-on: codebuild-CryptoToolsCI-linux-aws-database-encryption-sdk-dynamodb-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Support longpaths
        run: |
          git config --global core.longpaths true

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.head_ref || github.ref }}
          submodules: recursive

      - name: Use the latest installed .NET SDK
        if: runner.os == 'Linux'
        shell: bash
        run: echo '{"sdk":{"version":"6.0.100","rollForward":"latestMajor"}}' > "$RUNNER_WORKSPACE/global.json"

      - name: Upgrade Node
        uses: actions/setup-node@v6
        with:
          node-version: 21

      - name: Setup Dafny
        uses: ./submodules/MaterialProviders/.github/actions/setup_dafny/
        with:
          dafny-version: ${{ inputs.dafny }}

      - name: Check format of Java code et al
        run: |
          make format_java_misc-check

      - name: Check format of Dafny code
        run: |
          make format_dafny-check

      - name: Check format of Dotnet code
        run: |
          make format_net-check
