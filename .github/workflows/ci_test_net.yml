# This workflow performs tests in .NET.
name: test dotnet

on:
  workflow_call:
    inputs:
      dafny:
        description: "The Dafny version to run"
        required: true
        type: string
      branch:
        description: "Branch to checkout"
        required: false
        type: string
      regenerate-code:
        description: "Regenerate code using smithy-dafny"
        required: false
        default: false
        type: boolean
      mpl-head:
        description: "Running on MPL HEAD"
        required: false
        default: false
        type: boolean

jobs:
  testDotNet:
    strategy:
      matrix:
        library: [DynamoDbEncryption]
        dotnet-version: ["6.0.x"]
        os: [macos-15, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Support longpaths on Git checkout
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.head_ref || github.ref }}
          submodules: recursive

      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Setup .NET OpenSSL on Mac
        if: matrix.os == 'macos-15'
        run: |
          brew install openssl@3
          echo "DYLD_LIBRARY_PATH=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV
          echo "DOTNET_CRYPTO_ENGINE_ADAPTER=System.Security.Cryptography.Algorithms.Managed" >> $GITHUB_ENV

      - name: Setup Dafny
        uses: ./submodules/MaterialProviders/.github/actions/setup_dafny/
        with:
          dafny-version: ${{ inputs.dafny }}

      - name: Update MPL submodule if using MPL HEAD
        if: ${{ inputs.mpl-head == true }}
        working-directory: submodules/MaterialProviders
        run: |
          git checkout main
          git pull
          git submodule update --init --recursive
          git rev-parse HEAD

      - name: Install Smithy-Dafny codegen dependencies
        uses: ./submodules/MaterialProviders/.github/actions/install_smithy_dafny_codegen_dependencies
        with:
          mpl-submodule-path: ./submodules/MaterialProviders/

      - name: Regenerate code using smithy-dafny if necessary
        if: ${{ inputs.regenerate-code }}
        uses: ./.github/actions/polymorph_codegen
        with:
          dafny: ${{ env.DAFNY_VERSION }}
          library: ${{ matrix.library }}
          diff-generated-code: false
          update-and-regenerate-mpl: true

      - name: Download Dependencies
        working-directory: ./${{ matrix.library }}
        run: make setup_net

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-DDBEC-Dafny-Role-us-west-2
          role-session-name: DDBEC-Dafny-Net-Tests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      - name: Compile ${{ matrix.library }} implementation
        shell: bash
        working-directory: ./${{ matrix.library }}
        run: |
          # This works because `node` is installed by default on GHA runners
          CORES=$(node -e 'console.log(os.cpus().length)')
          make transpile_net CORES=$CORES

      - name: Test ${{ matrix.library }} net48
        if: matrix.os == 'windows-latest'
        working-directory: ./${{ matrix.library }}
        shell: bash
        run: |
          dotnet restore runtimes/net/tests
          dotnet build runtimes/net/tests
          make test_net FRAMEWORK=net48

      # The test server dashboard merges this run's line coverage, line by
      # line, with the coverage the .NET test server gives the same commit.
      - name: Setup .NET 8 for dotnet-coverage
        if: runner.os == 'Linux' && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Turn on line coverage
        if: runner.os == 'Linux' && (github.event_name == 'pull_request' || github.event_name == 'push')
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/local-coverage"
          dir="$RUNNER_TEMP/dotnet-coverage"
          dotnet tool install dotnet-coverage --version 18.12.0 --tool-path "$dir"
          echo "DOTNET_COVERAGE=$dir/dotnet-coverage" >> "$GITHUB_ENV"
          echo "DOTNET_COVERAGE_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
          echo "DOTNET_COVERAGE_NOLOGO=1" >> "$GITHUB_ENV"
          echo "LOCAL_COVERAGE=dbesdk" >> "$GITHUB_ENV"

      - name: Test ${{ matrix.library }} net6.0
        working-directory: ./${{ matrix.library }}
        shell: bash
        run: |
          dotnet restore runtimes/net/tests
          dotnet build runtimes/net/tests
          if [ -n "${DOTNET_COVERAGE:-}" ]; then
            "$DOTNET_COVERAGE" collect --output-format cobertura \
              --output "$RUNNER_TEMP/local-coverage/net.cobertura.xml" \
              -- make test_net FRAMEWORK=net6.0
          else
            make test_net FRAMEWORK=net6.0
          fi

      # Paths are made relative to the repository so the two reports line up.
      - name: Write the line coverage report
        if: env.LOCAL_COVERAGE != ''
        shell: bash
        run: |
          python3 .github/scripts/coverage_lcov.py cobertura \
            "$RUNNER_TEMP/local-coverage/net.cobertura.xml" "$RUNNER_TEMP/local-coverage/dbesdk-net.lcov" \
            --keep ${{ matrix.library }}/runtimes/net/ --drop ${{ matrix.library }}/runtimes/net/tests/

      - name: Upload the line coverage report
        if: env.LOCAL_COVERAGE != ''
        uses: actions/upload-artifact@v7
        with:
          name: local-coverage-dbesdk-net
          path: ${{ runner.temp }}/local-coverage/dbesdk-net.lcov
          if-no-files-found: warn

      - name: Test Build and Pack ${{ matrix.library}}
        shell: bash
        if: matrix.os != 'windows-latest'
        working-directory: ./${{ matrix.library }}
        run: |
          dotnet build runtimes/net /p:Configuration=Release -nowarn:CS0162,CS0168
          dotnet pack runtimes/net/DynamoDbEncryption.csproj --no-build /p:Configuration=Release --output build
