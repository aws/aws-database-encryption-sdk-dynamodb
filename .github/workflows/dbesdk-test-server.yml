# ============================================================================
# DB-ESDK TestServer CI (product repo) — inline run against the commons harness.
# ----------------------------------------------------------------------------
# The harness + test cases + orchestrator live in the PRIVATE repo
# aws-crypto-tools-commons. A cross-repo `uses:` of its reusable workflow is
# blocked (a private repo's Actions access is not shared), so this workflow does
# NOT call it. Instead it checks the commons harness out with a read-only PAT
# (secret COMMONS_REPO_PAT) and runs `make orchestrate` here, pointing the
# orchestrator's working-tree overlay at THIS PR's checkout so the run tests
# these servers.
#
# TEMPORARY: COMMONS_REF points at the aws-crypto-tools-commons#16 branch, which
# carries the harness until #16 merges. Switch COMMONS_REF to `main` once #16 is
# merged.
#
# Prerequisites:
#   * Repo secret COMMONS_REPO_PAT: a token with Contents:Read on
#     aws-crypto-tools-commons (fine-grained) or `repo` scope (classic).
#   * The KMS OIDC role's trust policy must trust this repo
#     (aws-database-encryption-sdk-dynamodb) so the required KMS scenarios can
#     get credentials from a product-repo-triggered run.
# ============================================================================

name: DB-ESDK TestServer

on:
  pull_request:
    paths:
      - "test-server/**"
      - ".github/workflows/dbesdk-test-server.yml"
  push:
    branches:
      - main
    paths:
      - "test-server/**"
      - ".github/workflows/dbesdk-test-server.yml"
  workflow_dispatch:

# contents:read to check out; id-token:write for the OIDC token exchange the
# required KMS scenarios need.
permissions:
  contents: read
  id-token: write

jobs:
  test-server:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.DBESDK_TEST_SERVER_KMS_REGION || 'us-west-2' }}
      AWS_DEFAULT_REGION: ${{ vars.DBESDK_TEST_SERVER_KMS_REGION || 'us-west-2' }}
      # Daemon-less so every server/Tests JVM the orchestrator forks inherits
      # the live step environment (the short-lived OIDC AWS_* credentials).
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      # OIDC role for the required KMS + keystore scenarios; its trust policy
      # must trust this repo. Override via the repo variable to target a
      # different account/role.
      KMS_CI_ROLE_ARN: ${{ vars.DBESDK_TEST_SERVER_KMS_ROLE_ARN || 'arn:aws:iam::370957321024:role/dbesdk-test-server-ci-kms-role' }}
      # TEMPORARY: the harness lives on the #16 branch until it merges to commons
      # main. Change to `main` once aws-crypto-tools-commons#16 is merged.
      COMMONS_REF: huaye/dbesdk-test-server-main

    steps:
      - name: Checkout the DB-ESDK servers (this PR's commit)
        # This repo, at the PR commit — fed to `make orchestrate` as the
        # working-tree overlay so the run tests THESE servers.
        uses: actions/checkout@v4
        with:
          path: dbe

      - name: Checkout aws-crypto-tools-commons harness (private, via PAT)
        # The harness + Configuration_Set (tests, model, orchestrator,
        # server-config) live in the PRIVATE commons repo, so the checkout needs
        # a read-only token; the default GITHUB_TOKEN cannot read another repo.
        uses: actions/checkout@v4
        with:
          repository: aws/aws-crypto-tools-commons
          ref: ${{ env.COMMONS_REF }}
          token: ${{ secrets.COMMONS_REPO_PAT }}
          path: commons

      - name: Set up JDK 21 (Temurin) for the commons harness + Java server
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Rust toolchain (for the rust-v1 Language_Server)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Set up Go (for the Rust server's aws-lc-sys native build)
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: Set up .NET 8 (for the net-v4 Language_Server)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore Gradle + cargo + NuGet caches
        uses: actions/cache/restore@v4
        id: caches
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
          key: >-
            ${{ runner.os }}-dbesdk-test-server-${{ hashFiles(
              'commons/dbesdk/test-server/*/build.gradle.kts',
              'commons/dbesdk/test-server/*/gradle/wrapper/gradle-wrapper.properties'
            ) }}
          restore-keys: |
            ${{ runner.os }}-dbesdk-test-server-

      - name: Install Smithy CLI
        # `make validate` runs `smithy validate` on the model. Deterministic
        # download of the official release, version-pinned; no third-party action.
        run: |
          set -euo pipefail
          SMITHY_VERSION="1.58.0"
          url="https://github.com/smithy-lang/smithy/releases/download/${SMITHY_VERSION}/smithy-cli-linux-x86_64.zip"
          tmp="$(mktemp -d)"
          curl -sSL "$url" -o "$tmp/smithy-cli.zip"
          unzip -q "$tmp/smithy-cli.zip" -d "$tmp"
          sudo "$tmp/smithy-cli-linux-x86_64/install"
          smithy --version

      - name: Rewrite the DBE repo SSH URL to public HTTPS
        # Defensive: the run uses the DBE working-tree overlay below (no server
        # clone), but if any component resolves via git, the Server_Locations
        # use an SSH URL. That repo is PUBLIC, so rewrite SSH to plain HTTPS so a
        # clone works without SSH keys on the runner.
        run: |
          set -euo pipefail
          git config --global \
            url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure AWS credentials via OIDC
        # continue-on-error so the next step fails with an actionable message
        # (rather than a generic action error) when no role is configured / a
        # fork PR has no id-token.
        id: aws-credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.KMS_CI_ROLE_ARN }}
          aws-region: ${{ vars.DBESDK_TEST_SERVER_KMS_REGION || 'us-west-2' }}

      - name: Verify AWS credentials are active (gates the orchestrated run)
        # DB-ESDK scenarios call real KMS + a branch-key DDB keystore, so the
        # run cannot pass without usable credentials. Fail HERE, before
        # orchestrate, with an actionable message.
        run: |
          if ! aws sts get-caller-identity; then
            echo "::error::No usable AWS credentials for the required DB-ESDK KMS scenarios." >&2
            echo "This run needs GitHub OIDC access to the role ${KMS_CI_ROLE_ARN}, whose trust" >&2
            echo "policy must trust aws-database-encryption-sdk-dynamodb and whose permissions must" >&2
            echo "reach the DB-ESDK KMS keys + branch-key DynamoDB keystore. A fork PR with no" >&2
            echo "id-token cannot exercise the required KMS scenarios and therefore cannot pass." >&2
            exit 1
          fi

      - name: Validate model (smithy validate + model smoke checks)
        working-directory: commons/dbesdk/test-server
        run: make validate

      - name: Orchestrated Commons_Run (make orchestrate)
        # One invocation resolves every target from the commons working tree's
        # Configuration_Set, builds each Language_Server from THIS PR's checkout
        # (the working-tree overlay), launches them, runs the Tests over the
        # cross-language matrix, and exits non-zero on any failed result.
        working-directory: commons/dbesdk/test-server
        env:
          # Concurrent server builds on a 2-core runner need a wide readiness
          # window (mirrors the ESDK workflow's 900s).
          DBESDK_TESTSERVER_READY_TIMEOUT_SECONDS: "900"
        run: make orchestrate DBESDK_DBE_REPO="${{ github.workspace }}/dbe"

      - name: Publish test results to the run summary
        # Renders the cross-language coverage matrix, failed-tests table,
        # skipped-by-reason table (with languages), and known-bugs table on the
        # Actions run's Summary page directly from the JUnit XML.
        if: always()
        run: |
          python3 commons/dbesdk/test-server/tools/ci_summary.py \
            commons/dbesdk/test-server/tests/build/test-results >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports + Resolution_Record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbesdk-test-server-reports
          path: |
            commons/dbesdk/test-server/orchestrator/build/resolution-record.json
            commons/dbesdk/test-server/orchestrator/build/launch/*/*.log
            commons/dbesdk/test-server/tests/build/reports/tests
            commons/dbesdk/test-server/tests/build/test-results
          if-no-files-found: ignore

      - name: Save Gradle + cargo + NuGet caches
        if: always() && steps.caches.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
          key: >-
            ${{ runner.os }}-dbesdk-test-server-${{ hashFiles(
              'commons/dbesdk/test-server/*/build.gradle.kts',
              'commons/dbesdk/test-server/*/gradle/wrapper/gradle-wrapper.properties'
            ) }}
