# This workflow performs static analysis checks.
name: static analysis

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  not-grep:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    runs-on: codebuild-CryptoToolsCI-linux-aws-database-encryption-sdk-dynamodb-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - name: Install setuptools dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools==81.0.0
      - name: not-grep
        run: |
          python -m pip install not-grep==1.0.1
          not-grep --config .github/not-grep.toml
