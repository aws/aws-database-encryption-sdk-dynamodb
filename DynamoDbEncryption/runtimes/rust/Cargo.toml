[package]
name = "aws-db-esdk"
version = "1.3.0"
edition = "2021"
keywords = ["cryptography", "security", "dynamodb", "encryption", "client-side"]
license = "ISC AND (Apache-2.0 OR ISC)"
description = "aws-db-esdk is a library for implementing client side encryption with DynamoDB."
homepage = "https://github.com/aws/aws-database-encryption-sdk-dynamodb/tree/main/releases/rust/db_esdk"
repository = "https://github.com/aws/aws-database-encryption-sdk-dynamodb/tree/main/releases/rust/db_esdk"
authors = ["AWS-CryptoTools"]
documentation = "https://docs.rs/crate/aws-db-esdk"
autoexamples = false
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aws-config = "1.8.12"
aws-lc-rs = {version = "1.18.0"}
aws-lc-sys = { version = "0.45", optional = true }
aws-lc-fips-sys = { version = "0.14.1", optional = true }
aws-sdk-dynamodb = "1.103.0"
aws-sdk-kms = "1.98.0"
aws-smithy-runtime-api = {version = "1.10.0", features = ["client"] }
# aws-smithy-types has a coherence conflict (E0119) with time >= 0.3.37 on rustc >= 1.80.
# time 0.3.37+ introduces ModifierValue associated type impls that conflict with
# CanDisable<T>'s blanket `impl<T> From<T>`. Pin time until upstream fixes it.
# See: https://github.com/time-rs/time/issues/720
time = ">=0.3.0, <0.3.56"
# Cap below 1.7: aws-smithy-types 1.7.0 changed Document::Object to carry a new
# DocumentObject struct instead of HashMap<String, Document>, which the
# aws-smithy-json 0.63.0 pulled in by the pinned aws-sdk-* / aws-config versions
# does not compile against (E0308/E0004). Stay on the 1.6.x line until those SDK
# deps advance to an aws-smithy-json that supports 1.7.
aws-smithy-types = ">=1.3.6, <1.7"
chrono = "0.4.43"
cpu-time = "1.0.0"
dafny_runtime = { path = "../../../submodules/smithy-dafny/TestModels/dafny-dependencies/dafny_runtime_rust", features = ["sync","small-int"] }
dashmap = "6.1.0"
pem = "4.0.0"
tokio = {version = "1.49.0", features = ["full"] }
uuid = { version = "1.19.0", features = ["v4"] }

[[example]]
name = "main"

[features]
fips = ["aws-lc-rs/fips", "dep:aws-lc-fips-sys"]
non-fips = ["aws-lc-rs/aws-lc-sys", "dep:aws-lc-sys"]
default = ["non-fips"]
