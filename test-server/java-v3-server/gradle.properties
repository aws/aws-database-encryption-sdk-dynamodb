# Versions for the DBE-ESDK Java Language_Server, kept in lockstep with the
# single generated Java Test_Client (in commons dbesdk/test-server/client-java)
# so the wire contract is identical on both ends. smithy-java 1.4.0 is the
# current stable release on Maven Central; smithyProtocolTraitsVersion matches
# the pin the model's own smithy-build.json uses.
smithyGradleVersion=1.4.0
smithyJavaVersion=1.4.0
smithyProtocolTraitsVersion=1.58.0

# The published AWS Database Encryption SDK for DynamoDB (Java) GA artifact,
# consumed from Maven Central for this pass to prove the harness end to end.
# Building the working tree instead requires the DBE Java library's full
# Dafny transpile — a follow-up switches this to a distinct
# `<version>-LIVE-SNAPSHOT` installed to the local Maven repo by a
# JavaLaunchPlan step, mirroring what the ESDK Language_Server does.
dbeVersion=3.8.1

# The AWS Cryptographic Material Providers library (keyrings & CMMs). DBE
# 3.8.1 was released against MPL 1.10.1 — keep the versions matched to avoid
# runtime NoSuchMethodError between the two Dafny-generated jars.
materialProvidersVersion=1.10.1

# The AWS SDK for Java v2 BOM. Governs both `dynamodb` (for AttributeValue)
# and `kms` (for the KMS keyring variants). Pinned to the version the MPL
# 1.11.x BOM resolves so the two stay in lockstep.
awsSdkVersion=2.31.0

# jqwik is the established Java property-based testing library. JUnit 5
# platform hosts both jqwik and the example-based unit tests.
jqwikVersion=1.9.2
junitVersion=5.11.3

# Run the Smithy CLI in a forked process to isolate its classloader from Gradle.
org.gradle.jvmargs=-Xmx2g
